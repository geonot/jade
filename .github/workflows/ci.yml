name: jinn-ci

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev

      - name: Format check
        run: cargo fmt --all --check

      - name: Type check
        run: cargo check --all-targets

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # --no-fail-fast: a red test must fail CI with the FULL failure list,
      # not stop at the first failing binary — commit f82402f shipped two red
      # tests (the grammar-drift detector) because the local run stopped early.
      # JINN_PROPTEST_CASES: the compile-and-run property suites default to a
      # small case count so the local edit-test loop stays fast. CI is the
      # place that buys the coverage back.
      - name: Tests
        run: cargo test --all-targets --no-fail-fast
        env:
          JINN_PROPTEST_CASES: 64

  ebnf-roundtrip:
    # EBNF ↔ implementation drift detector (P1-13). The Rust half
    # (`tests/ebnf_roundtrip.rs`) checks EBNF self-consistency, the
    # EBNF↔lexer keyword set, and that every snippet in
    # `tests/ebnf_corpus/` is accepted by the real parser. This job
    # additionally feeds the SAME corpus through the tree-sitter
    # grammar and fails if tree-sitter reports any ERROR node — i.e.
    # a construct the parser accepts but tree-sitter rejects (or vice
    # versa) is flagged as drift.
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev

      - name: EBNF ↔ parser drift (Rust)
        run: cargo test --release --test ebnf_roundtrip

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install tree-sitter CLI
        run: npm install -g tree-sitter-cli@^0.24.0

      - name: Generate tree-sitter parser
        working-directory: tree-sitter-jinn
        run: tree-sitter generate

      - name: tree-sitter grammar corpus tests
        working-directory: tree-sitter-jinn
        run: tree-sitter test

      # The tree-sitter grammar is editor tooling kept in lockstep with the
      # reference parser. The SAME `tests/ebnf_corpus/` snippets that the Rust
      # gate feeds through the reference parser are fed through the grammar
      # here; any ERROR node means a construct the parser accepts but the
      # grammar rejects (or vice versa), i.e. genuine drift — and fails CI.
      - name: EBNF corpus ↔ tree-sitter drift
        working-directory: tree-sitter-jinn
        run: |
          set -uo pipefail
          fail=0
          for f in ../tests/ebnf_corpus/*.jn; do
            echo "tree-sitter parse: $f"
            if ! tree-sitter parse --quiet "$f"; then
              echo "::error file=$f::tree-sitter rejected a corpus snippet the reference parser accepts (grammar drift)"
              fail=1
            fi
          done
          exit "$fail"

  wal-property:
    # WAL crash-consistency property tests (P1-14). Drives the C runtime
    # WAL through randomized op sequences and randomized crash points
    # (torn-tail truncation, mid-entry truncation, CRC corruption) and
    # asserts the prefix invariant: replay always returns a byte-exact
    # prefix of the written entries — never a partial entry, never
    # reordered, never corrupted. PROPTEST_CASES is raised well above the
    # 256-case default to give a ~5-minute randomized soak per the roadmap.
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
      RUSTFLAGS: "-D warnings"
      PROPTEST_CASES: "100000"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev

      - name: WAL property tests
        run: cargo test --release --test wal_property

  fuzz-smoke:
    # Coverage-guided fuzz harnesses (P0-11). Requires nightly for
    # cargo-fuzz. Runs each target for a short window — long enough
    # to catch new panics on every PR without blocking merges on
    # exhaustive coverage. A separate scheduled job (TODO) can run
    # the same harnesses for hours.
    runs-on: ubuntu-latest
    env:
      LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust nightly + cargo-fuzz
        uses: dtolnay/rust-toolchain@nightly
      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz lexer (30s)
        working-directory: fuzz
        run: cargo +nightly fuzz run lexer -- -max_total_time=30
      - name: Fuzz parser (30s)
        working-directory: fuzz
        run: cargo +nightly fuzz run parser -- -max_total_time=30
      - name: Fuzz typer (30s)
        working-directory: fuzz
        run: cargo +nightly fuzz run typer -- -max_total_time=30

  bench-regression:
    # Benchmark regression gate (task 8-26). Re-runs the benchmark suite
    # and fails on a >10% regression of any comparable benchmark's jinn/c
    # ratio versus the committed baseline (benchmarks/results.csv). The
    # ratio — not absolute time — is compared, because the baseline was
    # measured on developer hardware and this job runs on whatever the CI
    # pool provides; the ratio of the same run on the same machine is
    # hardware-normalized. Rows tagged non-comparable and rows under the
    # 50ms noise floor are reported but not gated (ci/bench_regression.py).
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev

      - name: Benchmark regression gate
        env:
          CC: clang-21
        run: python3 ci/bench_regression.py

  sanitize:
    # Runtime C sanitizer sweep (P0-11). Builds the C runtime under
    # ASan+UBSan and again under TSan, then runs the full test
    # suite under each. Runs on every PR but is allowed to fail
    # (continue-on-error) until the runtime is fully clean.
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      LLVM_SYS_210_PREFIX: /usr/lib/llvm-21
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev
      - name: Run sanitize sweep
        run: ./ci/sanitize.sh

  sanitize-corpus:
    # Executable-corpus ASan+LSan sweep + ownership-mutation fuzz (GATE-2).
    # Compiles every corpus program against an instrumented runtime and runs
    # it; any memory corruption fails the job. Leaks are reported but do not
    # gate (the tracked O-2 residue) — JINN_SAN_STRICT=1 flips that once the
    # leak tail is worked down.
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LLVM_SYS_211_PREFIX: /usr/lib/llvm-21
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM 21 + build deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y wget gnupg lsb-release software-properties-common
          wget https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo apt-key add llvm-snapshot.gpg.key
          sudo add-apt-repository "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-21 main"
          sudo apt-get update
          sudo apt-get install -y llvm-21 llvm-21-dev clang-21 lld-21 pkg-config libssl-dev libsqlite3-dev

      - name: Corpus sanitizer sweep
        run: ./ci/sanitize-corpus.sh

      - name: Ownership mutation fuzz
        run: python3 ci/fuzz-ownership.py
